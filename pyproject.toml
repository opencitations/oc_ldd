[project]
name = "oc-ldd"
version = "1.3.1"
description = "OpenCitations Linked Data Director (LDD) service"
authors = [
    {name = "Mario Petrella", email = "mario.petrella@unibo.it"},
]
license = {text = "ISC"}
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "gevent>=1.4",
    "gitpython>=3.2.1",
    "gunicorn[gevent]>=27.0.1",
    "rdflib>=6.1.1,<8",
    "requests>=2.32.4",
    "web-py>=0.76",
]

# This is a web service, not a library: uv only installs the dependencies
# and never builds/installs the project itself (no build step at container start)
[tool.uv]
package = false
